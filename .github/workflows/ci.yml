name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint / format (Biome)
        run: npx biome ci .
      - name: Type check
        run: npx tsc -b
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx vite build
